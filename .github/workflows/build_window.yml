name: Build Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet flet-charts flet-cli

      - name: Build Web
        run: flet build web --yes

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: app-web
          path: build/web/*
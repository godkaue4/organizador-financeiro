
name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.5" flet-charts flet-cli

      - name: Compilar aplicativo Windows
        run: flet build windows --yes

      - name: Verificar arquivos gerados
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows")) {
            Write-Error "A pasta build/windows não foi criada."
            exit 1
          }

          Get-ChildItem "build/windows" -Recurse

          $exe = Get-ChildItem "build/windows" -Filter "*.exe" -Recurse

          if (!$exe) {
            Write-Error "Nenhum executável EXE foi encontrado."
            exit 1
          }

          Write-Host "Executável encontrado:"
          $exe | ForEach-Object { Write-Host $_.FullName }

      - name: Enviar aplicativo como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: build/windows/
          if-no-files-found: error
          compression-level: 6
          


name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.5" flet-charts

      - name: Configure JNI dependency
        run: |
          cat > pyproject.toml <<'EOF'
          [tool.flet.flutter.pubspec.dependency_overrides]
          jni = "^1.1.0"
          EOF

          echo "Configuração JNI:"
          cat pyproject.toml

      - name: Build APK
        run: flet build apk --yes --verbose

      - name: Verify JNI version
        if: always()
        run: |
          if [ -f build/flutter/pubspec.lock ]; then
            grep -A 5 '^  jni:' build/flutter/pubspec.lock || true
          else
            echo "pubspec.lock não encontrado."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
          if-no-files-found: error
          
